<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmailShare - Success</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">
</head>
<body class="bg-gradient">
    <div class="glass-container center-panel" style="text-align: center; display: flex; flex-direction: column; gap: 24px;">
        <div class="app-header" style="margin-bottom: 0;">
            <div class="logo">
                <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
                <h1 style="color: #4ade80; background: none; -webkit-text-fill-color: #4ade80;">Success!</h1>
            </div>
            <p class="subtitle" style="margin-top: 8px;">Account <strong>{{ email_address }}</strong> is perfectly linked.</p>
        </div>

        <div style="background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 32px 16px;">
            <p style="font-size: 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; margin-bottom: 16px;">Your Access PIN</p>
            <div style="font-size: 48px; font-weight: 700; letter-spacing: 12px; font-family: monospace; color: #f8fafc; text-shadow: 0 0 20px rgba(129, 140, 248, 0.5);">
                {{ pin }}
            </div>
        </div>
    </div>
</body>
</html>
